<!-- WRAPPER DU GRID -->
<div class="row">
  <div class="col-6 col-sm-4 col-md-3 mb-4" *ngFor="let annonce of annonces">
    <div class="product-card text-center">
      <img [src]="annonce.imagesUrls[0]" class="img-fluid product-image" alt="Image produit" />
      <h6 class="mt-2 product-title">{{ annonce.titre }}</h6>
      <p class="text-muted product-price">{{ annonce.prix | currency:'USD' }}</p>

      <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" [attr.data-bs-target]="'#modalAnnonce' + annonce.id">
        Voir détails
      </button>
    </div>
  </div>
</div>

<!-- MODAL POUR CHAQUE ANNONCE -->
<div *ngFor="let annonce of annonces">
  <div class="modal fade" [id]="'modalAnnonce' + annonce.id" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ annonce.titre }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <p>{{ annonce.description }}</p>
          <div *ngIf="annonce.imagesUrls && annonce.imagesUrls.length > 0" class="d-flex flex-wrap">
            <img *ngFor="let img of annonce.imagesUrls" [src]="img" class="img-thumbnail me-2 mb-2" style="width: 150px;" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
